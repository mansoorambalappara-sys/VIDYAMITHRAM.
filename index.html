<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>വിദ്യമിത്രം സ്കൂൾ ആപ്പ് - GLPS Mundekkara</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- PWA / Add to Home Screen Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        body {
            font-family: 'Anek Malayalam', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .text-3d {
            text-shadow: 1px 2px 0px #4a004a, 
                         2px 4px 0px #330033, 
                         3px 6px 10px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
        }

        .title-font {
            font-weight: 800;
            font-family: 'Anek Malayalam', sans-serif;
        }

        .app-container {
            width: 100%;
            max-width: 480px; /* Mobile app feel */
            min-height: 100vh;
            background-color: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow-x: hidden;
        }

        @media (min-width: 481px) {
            .app-container {
                min-height: 90vh;
                border-radius: 24px;
                margin: 20px 0;
            }
        }

        /* 3D Button Styles */
        .btn-3d-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 16px;
        }

        .btn-3d {
            position: relative;
            background: linear-gradient(to bottom, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 8px;
            font-weight: 700;
            font-size: 0.85rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0px 6px 0px #1d4ed8, 0px 8px 10px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 90px;
            word-wrap: break-word;
            line-height: 1.2;
            font-family: 'Anek Malayalam', sans-serif;
        }

        .btn-3d:active {
            transform: translateY(6px);
            box-shadow: 0px 0px 0px #1d4ed8, 0px 2px 4px rgba(0,0,0,0.2);
        }

        .btn-3d i {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #dbeafe;
        }

        /* Distinct colors for buttons based on categories */
        .btn-red { background: linear-gradient(to bottom, #ef4444, #dc2626); box-shadow: 0px 6px 0px #b91c1c, 0px 8px 10px rgba(0,0,0,0.2); }
        .btn-red:active { box-shadow: 0px 0px 0px #b91c1c, 0px 2px 4px rgba(0,0,0,0.2); }

        .btn-green { background: linear-gradient(to bottom, #10b981, #059669); box-shadow: 0px 6px 0px #047857, 0px 8px 10px rgba(0,0,0,0.2); }
        .btn-green:active { box-shadow: 0px 0px 0px #047857, 0px 2px 4px rgba(0,0,0,0.2); }
        
        .btn-purple { background: linear-gradient(to bottom, #8b5cf6, #7c3aed); box-shadow: 0px 6px 0px #5b21b6, 0px 8px 10px rgba(0,0,0,0.2); }
        .btn-purple:active { box-shadow: 0px 0px 0px #5b21b6, 0px 2px 4px rgba(0,0,0,0.2); }

        .btn-orange { background: linear-gradient(to bottom, #f97316, #ea580c); box-shadow: 0px 6px 0px #c2410c, 0px 8px 10px rgba(0,0,0,0.2); }
        .btn-orange:active { box-shadow: 0px 0px 0px #c2410c, 0px 2px 4px rgba(0,0,0,0.2); }

        /* News Layout Styles */
        .news-card {
            display: flex;
            flex-direction: column;
            background: #f8fafc;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }

        .news-image-container {
            width: 100%;
            padding: 12px;
        }

        .news-image {
            width: 100%;
            height: auto;
            border-radius: 12px;
            border: 4px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); /* Stroke and shadow as requested */
            object-fit: cover;
        }

        .news-content {
            padding: 16px;
        }

        @media (min-width: 400px) {
            .news-card {
                flex-direction: row;
                align-items: flex-start;
            }
            .news-image-container {
                width: 40%;
                padding-right: 0;
            }
            .news-content {
                width: 60%;
            }
        }

        /* Form Inputs */
        .input-field {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .input-field:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        /* Screen Transitions */
        .screen {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header Animation */
        .header-bg {
            background-image: url('data:image/svg+xml,%3Csvg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"%3E%3Cpath d="M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z" fill="%23ffffff" fill-opacity="0.2" fill-rule="evenodd"/%3E%3C/svg%3E');
        }
    </style>
</head>
<body>

    <div class="app-container flex flex-col relative">
        
        <!-- TOP HEADER (Always visible) -->
        <div class="bg-[#8b008b] text-white rounded-b-3xl pt-8 pb-6 px-6 text-center shadow-lg header-bg z-10 flex flex-col items-center">
            
            <div class="relative inline-block text-left mb-6">
                <h1 class="text-5xl md:text-6xl font-extrabold text-white text-3d title-font">വിദ്യമിത്രം</h1>
                
                <!-- School App label positioned under 'മിത്രം' -->
                <div class="absolute -bottom-5 right-1">
                    <div class="inline-block border border-white/50 bg-white/20 backdrop-blur-sm px-1.5 py-0.5 rounded shadow-sm">
                        <span class="text-[10px] font-bold tracking-wider uppercase text-white">School App</span>
                    </div>
                </div>
            </div>
            
            <p class="text-[11px] font-semibold text-fuchsia-100 uppercase tracking-wide mt-5">RUN BY: GLPS MUNDEKARAD</p>
        </div>

        <!-- NOTIFICATION/MESSAGE BOX -->
        <div id="message-box" class="absolute top-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full text-sm font-medium z-50 opacity-0 transition-opacity duration-300 pointer-events-none w-11/12 text-center shadow-xl">
            Message here
        </div>

        <!-- MAIN CONTENT AREA -->
        <div class="flex-1 overflow-y-auto pb-8 relative z-0">
            
            <!-- SCREEN 1: LOGIN -->
            <div id="screen-login" class="screen active px-6 pt-10">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold text-gray-800 mb-2 title-font">സ്വാഗതം</h2>
                    <p class="text-gray-500 text-sm">നിങ്ങളുടെ അക്കൗണ്ടിലേക്ക് പ്രവേശിക്കുക</p>
                </div>
                
                <form id="login-form" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                    <input type="text" id="login-username" placeholder="യൂസർനെയിം (Username)" class="input-field" required>
                    <input type="password" id="login-password" placeholder="പാസ്‌വേഡ് (Password)" class="input-field" required>
                    
                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-xl shadow-md hover:bg-blue-700 transition active:scale-95 text-lg mt-2">
                        ലോഗിൻ ചെയ്യുക
                    </button>
                </form>
                
                <div class="text-center mt-6">
                    <p class="text-gray-600 text-sm">അക്കൗണ്ട് ഇല്ലേ? 
                        <button onclick="switchScreen('screen-signup')" class="text-blue-600 font-bold hover:underline">സൈൻ അപ്പ് ചെയ്യുക</button>
                    </p>
                </div>
            </div>

            <!-- SCREEN 2: SIGNUP -->
            <div id="screen-signup" class="screen px-6 pt-10">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold text-gray-800 mb-2 title-font">പുതിയ അക്കൗണ്ട്</h2>
                    <p class="text-gray-500 text-sm">രക്ഷിതാക്കൾക്ക് അക്കൗണ്ട് നിർമ്മിക്കാം</p>
                </div>
                
                <form id="signup-form" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                    <input type="text" id="signup-name" placeholder="പൂർണ്ണമായ പേര് (Full Name)" class="input-field" required>
                    <input type="text" id="signup-username" placeholder="പുതിയ യൂസർനെയിം (Username)" class="input-field" required>
                    <input type="password" id="signup-password" placeholder="പുതിയ പാസ്‌വേഡ് (Password)" class="input-field" required>
                    
                    <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 px-4 rounded-xl shadow-md hover:bg-green-700 transition active:scale-95 text-lg mt-2">
                        അക്കൗണ്ട് നിർമ്മിക്കുക
                    </button>
                </form>
                
                <div class="text-center mt-6">
                    <p class="text-gray-600 text-sm">അക്കൗണ്ട് ഉണ്ടോ? 
                        <button onclick="switchScreen('screen-login')" class="text-blue-600 font-bold hover:underline">ലോഗിൻ ചെയ്യുക</button>
                    </p>
                </div>
            </div>

            <!-- SCREEN 3: DASHBOARD -->
            <div id="screen-dashboard" class="screen">
                <div class="px-4 pt-6 pb-2 flex justify-between items-center">
                    <h3 class="text-lg font-bold text-gray-800">മെനു (Menu)</h3>
                    <button onclick="logout()" class="text-red-500 text-sm font-semibold bg-red-50 px-3 py-1 rounded-full"><i class="fas fa-sign-out-alt mr-1"></i> ലോഗ് ഔട്ട്</button>
                </div>
                
                <div class="btn-3d-grid">
                    <!-- Row 1 -->
                    <button class="btn-3d btn-red" onclick="openCategory('news', 'സ്കൂൾ വാർത്തകൾ')">
                        <i class="fas fa-newspaper"></i>
                        സ്കൂൾ വാർത്തകൾ
                    </button>
                    <button class="btn-3d btn-purple" onclick="openCategory('newspaper', 'ശലഭം സ്കൂൾ പത്രം')">
                        <i class="fas fa-book-open"></i>
                        ശലഭം പത്രം
                    </button>
                    <button class="btn-3d btn-orange" onclick="openCategory('radio', 'ശിശുവാണി സ്കൂൾ റേഡിയോ')">
                        <i class="fas fa-radio"></i>
                        ശിശുവാണി റേഡിയോ
                    </button>
                    
                    <!-- Row 2 -->
                    <button class="btn-3d btn-green" onclick="openCategory('questions', 'ചോദ്യമഴ')">
                        <i class="fas fa-cloud-showers-heavy"></i>
                        ചോദ്യമഴ
                    </button>
                    <button class="btn-3d" onclick="openCategory('winners', 'വിന്നേഴ്സ് കോർണർ')">
                        <i class="fas fa-trophy"></i>
                        വിന്നേഴ്സ് കോർണർ
                    </button>
                    <button class="btn-3d btn-purple" onclick="openCategory('english', 'സ്മാർട്ട് ഇംഗ്ലീഷ്')">
                        <i class="fas fa-language"></i>
                        സ്മാർട്ട് ഇംഗ്ലീഷ്
                    </button>
                    
                    <!-- Row 3 -->
                    <button class="btn-3d btn-green" onclick="openCategory('malayalam', 'ഈസി മലയാളം')">
                        <i class="fas fa-pen-fancy"></i>
                        ഈസി മലയാളം
                    </button>
                    <button class="btn-3d btn-orange" onclick="openCategory('arabic', 'ബഹ്ജത്തുൽ അറബിയ')">
                        <span style="font-size: 1.8rem; margin-bottom: 8px; font-weight: bold; color: #dbeafe; font-family: Arial, sans-serif; line-height: 1;">ض</span>
                        ബഹ്ജത്തുൽ അറബിയ
                    </button>
                    <button class="btn-3d" onclick="openCategory('quiz', 'ക്വിസ് ഹബ്ബ്')">
                        <i class="fas fa-question-circle"></i>
                        ക്വിസ് ഹബ്ബ്
                    </button>
                    
                    <!-- Row 4 -->
                    <button class="btn-3d btn-red" onclick="openSubMenu('lss', 'എൽഎസ്എസ് തിളക്കം')">
                        <i class="fas fa-star"></i>
                        എൽഎസ്എസ് തിളക്കം
                    </button>
                    <button class="btn-3d btn-purple" onclick="openCategory('festivals', 'മേളകൾ')">
                        <i class="fas fa-music"></i>
                        മേളകൾ
                    </button>
                    <button class="btn-3d btn-green" onclick="openSubMenu('bank', 'ക്വസ്റ്റ്യൻ ബാങ്ക്')">
                        <i class="fas fa-database"></i>
                        ക്വസ്റ്റ്യൻ ബാങ്ക്

                </div>
            </div>

            <!-- SCREEN 3.5: SUBMENU (For Question Bank & LSS) -->
            <div id="screen-submenu" class="screen px-4 pt-4">
                <button id="submenu-back-btn" class="mb-4 text-blue-600 font-bold bg-white px-4 py-2 rounded-full shadow-sm border border-blue-100 flex items-center w-max active:scale-95 transition">
                    <i class="fas fa-arrow-left mr-2"></i> തിരികെ പോകുക
                </button>
                
                <h2 id="submenu-title" class="text-2xl font-bold text-gray-800 mb-6 title-font text-center border-b-2 border-blue-200 pb-2"></h2>
                
                <div id="submenu-grid" class="btn-3d-grid pb-10">
                    <!-- Submenu buttons will be dynamically added here -->
                </div>
            </div>

            <!-- SCREEN 4: CONTENT VIEW -->
            <div id="screen-content" class="screen px-4 pt-4">
                <button id="content-back-btn" onclick="switchScreen('screen-dashboard')" class="mb-4 text-blue-600 font-bold bg-white px-4 py-2 rounded-full shadow-sm border border-blue-100 flex items-center w-max active:scale-95 transition">
                    <i class="fas fa-arrow-left mr-2"></i> തിരികെ പോകുക
                </button>
                
                <h2 id="content-title" class="text-2xl font-bold text-gray-800 mb-6 title-font text-center border-b-2 border-blue-200 pb-2"></h2>
                
                <!-- Dynamic Content Container -->
                <div id="dynamic-content-area" class="pb-10">
                    <!-- Content will be injected here via JavaScript -->
                    <div class="text-center py-10 text-gray-500">
                        <i class="fas fa-circle-notch fa-spin text-3xl mb-3 text-blue-400"></i>
                        <p>വിവരങ്ങൾ ഗൂഗിൾ ഷീറ്റിൽ നിന്നും ലഭ്യമാക്കുന്നു...</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Initialization
        let app, db, auth;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'vidyamithram-app-demo';
        
        try {
            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
                // Dummy config to prevent errors if running outside the collaborative sandbox
            };
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (error) {
            console.log("Firebase not fully configured or running locally. Using local memory fallback.");
        }

        // Helper function for showing alerts/messages
        window.showMessage = function(msg, isError = false) {
            const msgBox = document.getElementById('message-box');
            msgBox.textContent = msg;
            msgBox.className = `absolute top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full text-sm font-medium z-50 transition-opacity duration-300 pointer-events-none w-11/12 text-center shadow-xl ${isError ? 'bg-red-600 text-white' : 'bg-gray-800 text-white'}`;
            msgBox.style.opacity = '1';
            setTimeout(() => {
                msgBox.style.opacity = '0';
            }, 3000);
        };

        // Navigation
        window.switchScreen = function(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            window.scrollTo(0,0);
        };

        // Local state for demo purposes if DB fails
        let localUsers = []; 
        let currentUser = null;

        // Initialize App Auth State
        async function initApp() {
            if (auth) {
                try {
                    await signInAnonymously(auth);
                    console.log("Authenticated anonymously for data access.");
                } catch (e) {
                    console.error("Auth error:", e);
                }
            }
            
            // Check if user is already logged in (using sessionStorage for temporary persistence)
            const savedUser = sessionStorage.getItem('vidya_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                switchScreen('screen-dashboard');
            } else {
                switchScreen('screen-login');
            }
        }

        // Signup Logic
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('signup-name').value;
            const username = document.getElementById('signup-username').value;
            const password = document.getElementById('signup-password').value;

            const userData = { name, username, password };

            try {
                if (db) {
                    // Store in public/data/app_users (As per strict Firebase path rules for sandbox)
                    const usersRef = collection(db, 'artifacts', appId, 'public', 'data', 'app_users');
                    
                    // Check if username exists (fetching all and filtering as per rule: No Complex Queries)
                    const querySnapshot = await getDocs(usersRef);
                    let exists = false;
                    querySnapshot.forEach((doc) => {
                        if (doc.data().username === username) exists = true;
                    });

                    if (exists) {
                        showMessage('ഈ യൂസർനെയിം നിലവിലുണ്ട്! വേറെ ഒരെണ്ണം നൽകുക.', true);
                        return;
                    }

                    await addDoc(usersRef, userData);
                } else {
                    localUsers.push(userData);
                }
                
                showMessage('അക്കൗണ്ട് വിജയകരമായി നിർമ്മിച്ചു! ദയവായി ലോഗിൻ ചെയ്യുക.');
                document.getElementById('signup-form').reset();
                switchScreen('screen-login');
                
            } catch (error) {
                console.error(error);
                showMessage('സാങ്കേതിക തകരാർ! വീണ്ടും ശ്രമിക്കുക.', true);
            }
        });

        // Login Logic
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            let validUser = null;

            try {
                if (username === 'admin' && password === 'admin123') {
                    // Hidden Admin Login
                    validUser = { name: "അഡ്മിൻ", username: "admin", role: "admin" };
                } else if (db) {
                    const usersRef = collection(db, 'artifacts', appId, 'public', 'data', 'app_users');
                    const querySnapshot = await getDocs(usersRef);
                    
                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        if (data.username === username && data.password === password) {
                            validUser = data;
                        }
                    });
                } else {
                    validUser = localUsers.find(u => u.username === username && u.password === password);
                }

                if (validUser) {
                    currentUser = validUser;
                    sessionStorage.setItem('vidya_user', JSON.stringify(validUser));
                    document.getElementById('login-form').reset();
                    showMessage('സ്വാഗതം ' + validUser.name + '!');
                    switchScreen('screen-dashboard');
                } else {
                    showMessage('യൂസർനെയിം അല്ലെങ്കിൽ പാസ്‌വേഡ് തെറ്റാണ്!', true);
                }
                
            } catch (error) {
                console.error(error);
                showMessage('സാങ്കേതിക തകരാർ! വീണ്ടും ശ്രമിക്കുക.', true);
            }
        });

        window.logout = function() {
            currentUser = null;
            sessionStorage.removeItem('vidya_user');
            switchScreen('screen-login');
            showMessage('ലോഗ് ഔട്ട് ചെയ്തു.');
        };

        /* 
        ---------------------------------------------------------
        Google Sheets Script Integration (Explanation for Admin)
        ---------------------------------------------------------
        നിങ്ങൾ ഗൂഗിൾ ഷീറ്റിൽ ഡാറ്റ നൽകിയ ശേഷം App Script വഴി Deploy ചെയ്ത് 
        കിട്ടുന്ന URL താഴെ കാണുന്ന `sheetApiUrl` എന്ന വേരിയബിളിൽ നൽകുക.
        
        App Script മാതൃക (Google Sheet-ൽ Extensions > Apps Script):
        
        function doGet(e) {
          var sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName("Data");
          var data = sheet.getDataRange().getValues();
          var result = [];
          
          for (var i = 1; i < data.length; i++) {
            result.push({
              category: data[i][0], // ഉദാ: 'news', 'newspaper'
              title: data[i][1],
              content: data[i][2],
              imageUrl: data[i][3],
              link: data[i][4]
            });
          }
          return ContentService.createTextOutput(JSON.stringify(result)).setMimeType(ContentService.MimeType.JSON);
        }
        ---------------------------------------------------------
        */

        const sheetApiUrl = "https://script.google.com/macros/s/AKfycbyMg03jqM2SAHOwysWlKTw5IkgWlEpNOUA6UCKE0-0j5kvW5AoLAlFOxpC1eTDhMmzLFA/exec"; // നിങ്ങളുടെ Google App Script Web App URL ഇവിടെ നൽകാം

        // ഡെമോയ്ക്കായി നൽകിയിരിക്കുന്ന സാങ്കൽപ്പിക ഡാറ്റ ഒഴിവാക്കി
        const mockData = [];

        window.openSubMenu = function(menuId, title) {
            document.getElementById('submenu-title').textContent = title;
            const grid = document.getElementById('submenu-grid');
            grid.innerHTML = ''; // Clear previous buttons
            
            let buttons = [];
            let backTarget = 'screen-dashboard';

            // Check if it's a deeply nested menu inside Question Bank to handle "Back" properly
            if (menuId.startsWith('bank_1') || menuId.startsWith('bank_2') || menuId.startsWith('bank_3') || menuId.startsWith('bank_4') || menuId === 'bank_pre') {
                backTarget = 'back_to_bank';
            }

            // Define Submenus
            if (menuId === 'bank') {
                buttons = [
                    { id: 'bank_pre', label: 'പ്രീ പ്രൈമറി', icon: 'fa-child', color: 'btn-red' },
                    { id: 'bank_1', label: 'ക്ലാസ്സ് 1', icon: 'fa-book', color: 'btn-green' },
                    { id: 'bank_2', label: 'ക്ലാസ്സ് 2', icon: 'fa-book', color: 'btn-purple' },
                    { id: 'bank_3', label: 'ക്ലാസ്സ് 3', icon: 'fa-book', color: 'btn-orange' },
                    { id: 'bank_4', label: 'ക്ലാസ്സ് 4', icon: 'fa-book', color: '' }
                ];
            } else if (menuId === 'bank_pre') {
                buttons = [
                    { cat: 'bank_lkg', label: 'LKG', icon: 'fa-shapes', color: 'btn-purple' },
                    { cat: 'bank_ukg', label: 'UKG', icon: 'fa-shapes', color: 'btn-orange' }
                ];
            } else if (menuId === 'bank_1' || menuId === 'bank_2') {
                let cls = menuId === 'bank_1' ? '1' : '2';
                buttons = [
                    { cat: `bank_${cls}_arabic`, label: 'അറബിക്', icon: 'fa-language', color: 'btn-green' },
                    { cat: `bank_${cls}_english`, label: 'ഇംഗ്ലീഷ്', icon: 'fa-font', color: 'btn-purple' },
                    { cat: `bank_${cls}_udg1`, label: 'ഉദ്ഗ്രഥിതം-1', icon: 'fa-leaf', color: 'btn-orange' },
                    { cat: `bank_${cls}_udg2`, label: 'ഉദ്ഗ്രഥിതം-2', icon: 'fa-leaf', color: 'btn-red' },
                    { cat: `bank_${cls}_udg3`, label: 'ഉദ്ഗ്രഥിതം-3', icon: 'fa-leaf', color: '' }
                ];
            } else if (menuId === 'bank_3' || menuId === 'bank_4') {
                let cls = menuId === 'bank_3' ? '3' : '4';
                buttons = [
                    { cat: `bank_${cls}_arabic`, label: 'അറബിക്', icon: 'fa-language', color: 'btn-green' },
                    { cat: `bank_${cls}_english`, label: 'ഇംഗ്ലീഷ്', icon: 'fa-font', color: 'btn-purple' },
                    { cat: `bank_${cls}_malayalam`, label: 'മലയാളം', icon: 'fa-pen-fancy', color: 'btn-orange' },
                    { cat: `bank_${cls}_evs`, label: 'ഇവിഎസ്', icon: 'fa-globe-asia', color: 'btn-red' },
                    { cat: `bank_${cls}_maths`, label: 'മാത്സ്', icon: 'fa-calculator', color: '' }
                ];
            } else if (menuId === 'lss') {
                buttons = [
                    { cat: 'lss_previous', label: 'പ്രീവിയസ് ക്വസ്റ്റ്യൻസ്', icon: 'fa-file-alt', color: 'btn-purple' },
                    { cat: 'lss_games', label: 'ഗെയിംസ്', icon: 'fa-gamepad', color: 'btn-orange' }
                ];
            } else if (menuId === 'festivals') {
                buttons = [
                    { cat: 'kalolsavam', label: 'സ്കൂൾ കലോത്സവം', icon: 'fa-theater-masks', color: 'btn-red' },
                    { cat: 'sports', label: 'സ്കൂൾ കായികമേള', icon: 'fa-running', color: 'btn-orange' },
                    { cat: 'sasthrolsavam', label: 'സ്കൂൾ ശാസ്ത്രോത്സവം', icon: 'fa-flask', color: 'btn-green' }
                ];
            }

            // Render Submenu Buttons
            buttons.forEach(btn => {
                const b = document.createElement('button');
                b.className = `btn-3d ${btn.color || ''}`;
                
                // Keep the text size consistent and readable for multi-line
                b.innerHTML = `
                    <i class="fas ${btn.icon}"></i>
                    <span style="font-size: 0.9rem;">${btn.label}</span>
                `;
                
                // If it has a 'cat', it fetches data. If it has 'id', it opens another submenu.
                if (btn.cat) {
                    b.onclick = () => openCategory(btn.cat, btn.label, 'screen-submenu');
                } else {
                    b.onclick = () => openSubMenu(btn.id, btn.label);
                }
                grid.appendChild(b);
            });

            // Handle Back Button Logic
            const backBtn = document.getElementById('submenu-back-btn');
            if (backTarget === 'back_to_bank') {
                backBtn.onclick = () => openSubMenu('bank', 'ക്വസ്റ്റ്യൻ ബാങ്ക്');
            } else {
                backBtn.onclick = () => switchScreen('screen-dashboard');
            }

            switchScreen('screen-submenu');
        };

        window.openCategory = async function(categoryId, title, backScreenId = 'screen-dashboard') {
            document.getElementById('content-title').textContent = title;
            document.getElementById('content-back-btn').setAttribute('onclick', `switchScreen('${backScreenId}')`);
            
            switchScreen('screen-content');
            
            const contentArea = document.getElementById('dynamic-content-area');
            contentArea.innerHTML = `<div class="text-center py-10 text-gray-500">
                <i class="fas fa-circle-notch fa-spin text-3xl mb-3 text-blue-400"></i>
                <p>വിവരങ്ങൾ ലഭ്യമാക്കുന്നു...</p>
            </div>`;

            let items = [];

            try {
                // If a Google sheet URL is provided, fetch from it
                if (sheetApiUrl !== "") {
                    const response = await fetch(sheetApiUrl);
                    const allData = await response.json();
                    items = allData.filter(item => item.category === categoryId);
                } else {
                    // Using Mock Data for preview
                    await new Promise(r => setTimeout(r, 600)); // Simulate network delay
                    items = mockData.filter(item => item.category === categoryId);
                }

                renderContent(items, categoryId, contentArea);

            } catch (error) {
                console.error("Error fetching data:", error);
                contentArea.innerHTML = `
                    <div class="text-center p-6 bg-red-50 rounded-xl border border-red-100">
                        <i class="fas fa-exclamation-triangle text-red-500 text-3xl mb-3"></i>
                        <p class="text-red-700">വിവരങ്ങൾ ലഭ്യമാക്കുന്നതിൽ തടസ്സം നേരിട്ടു.</p>
                    </div>`;
            }
        };

        function renderContent(items, categoryId, container) {
            if (items.length === 0) {
                container.innerHTML = `
                    <div class="text-center p-8 bg-gray-50 rounded-2xl border border-gray-200 mt-4">
                        <i class="fas fa-folder-open text-gray-300 text-5xl mb-4"></i>
                        <p class="text-gray-600 font-medium text-lg">പുതിയ വിവരങ്ങൾ ഉടൻ ഉൾപ്പെടുത്തും!</p>
                        <p class="text-sm text-gray-400 mt-2">No items found for this category.</p>
                    </div>`;
                return;
            }

            let html = '';

            items.forEach(item => {
                // Special Design for "സ്കൂൾ വാർത്തകൾ" (News) - Photo with stroke and text side-by-side
                if (categoryId === 'news') {
                    html += `
                    <div class="news-card">
                        ${item.imageUrl ? `
                        <div class="news-image-container">
                            <img src="${item.imageUrl}" alt="News Image" class="news-image" onerror="this.src='https://placehold.co/600x400/eeeeee/999999?text=No+Image'">
                        </div>` : ''}
                        <div class="news-content">
                            <h3 class="text-xl font-bold text-blue-900 mb-2">${item.title}</h3>
                            <p class="text-gray-700 leading-relaxed text-sm md:text-base">${item.content}</p>
                            ${item.link ? `<a href="${item.link}" target="_blank" rel="noopener noreferrer" class="inline-block mt-4 text-blue-600 font-bold hover:underline">കൂടുതൽ വായിക്കുക <i class="fas fa-external-link-alt text-xs ml-1"></i></a>` : ''}
                        </div>
                    </div>`;
                } 
                // Standard List Design for other categories (Radio, Newspaper, Quizzes etc.)
                else {
                    let actionButtonsHtml = '';
                    if (item.link) {
                        // Special PDF View and Download buttons for Newspaper and Question Bank
                        if (categoryId === 'newspaper' || categoryId === 'bank') {
                            actionButtonsHtml = `
                            <div class="flex space-x-3 mt-4">
                                <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="flex-1 flex justify-center items-center bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-2.5 px-3 rounded-lg transition border border-blue-200 text-sm">
                                    <i class="fas fa-book-reader mr-2"></i> വായിക്കുക
                                </a>
                                <a href="${item.link}" target="_blank" download rel="noopener noreferrer" class="flex-1 flex justify-center items-center bg-green-50 hover:bg-green-100 text-green-700 font-bold py-2.5 px-3 rounded-lg transition border border-green-200 text-sm">
                                    <i class="fas fa-download mr-2"></i> ഡൗൺലോഡ്
                                </a>
                            </div>`;
                        } else {
                            actionButtonsHtml = `
                            <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center w-full bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-3 px-4 rounded-lg transition mt-4 border border-blue-100">
                                <i class="fas fa-external-link-alt mr-2"></i> തുറക്കുക (Open Link)
                            </a>`;
                        }
                    }

                    html += `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 mb-4 hover:shadow-md transition">
                        <h3 class="text-lg font-bold text-gray-800 mb-2 flex items-center">
                            <i class="fas fa-bookmark text-blue-500 mr-2"></i> ${item.title}
                        </h3>
                        ${item.content ? `<p class="text-gray-600 mb-2 text-sm">${item.content}</p>` : ''}
                        ${actionButtonsHtml}
                    </div>`;
                }
            });

            container.innerHTML = html;
        }

        // Initialize App on load and Generate PWA Manifest dynamically
        window.addEventListener('DOMContentLoaded', () => {
            initApp();
            
            const manifest = {
                "name": "വിദ്യമിത്രം സ്കൂൾ ആപ്പ്",
                "short_name": "വിദ്യമിത്രം",
                "start_url": window.location.href,
                "display": "standalone",
                "background_color": "#e0f2fe",
                "theme_color": "#2563eb",
                "icons": [{
                    "src": "https://placehold.co/512x512/2563eb/ffffff?text=V",
                    "sizes": "512x512",
                    "type": "image/png"
                }]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            document.getElementById('pwa-manifest').setAttribute('href', URL.createObjectURL(manifestBlob));
        });

    </script>
</body>
</html>
