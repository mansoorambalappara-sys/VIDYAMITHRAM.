    <style>
        body {
            font-family: 'Anek Malayalam', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .text-3d {
            text-shadow: 1px 2px 0px #4a004a, 
                         2px 4px 0px #330033, 
                         3px 6px 10px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
        }

        .title-font {
            font-weight: 800;
            font-family: 'Anek Malayalam', sans-serif;
        }

        .app-container {
            width: 100%;
            max-width: 480px; /* Mobile app feel */
            min-height: 100vh;
            background-color: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow-x: hidden;
        }

        @media (min-width: 481px) {
            .app-container {
                min-height: 90vh;
                border-radius: 24px;
                margin: 20px 0;
            }
        }

        /* 3D Button Styles */
        .btn-3d-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 16px;
        }

        .btn-3d {
            position: relative;
            background: linear-gradient(to bottom, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 8px;
            font-weight: 700;
            font-size: 0.85rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0px 6px 0px #1d4ed8, 0px 8px 10px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 90px;
            word-wrap: break-word;
            line-height: 1.2;
            font-family: 'Anek Malayalam', sans-serif;
        }

        .btn-3d:active {
            transform: translateY(6px);
            box-shadow: 0px 0px 0px #1d4ed8, 0px 2px 4px rgba(0,0,0,0.2);
        }

        .btn-3d i {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #dbeafe;
        }

        /* Distinct colors for buttons based on categories */
        .btn-red { background: linear-gradient(to bottom, #ef4444, #dc2626); box-shadow: 0px 6px 0px #b91c1c, 0px 8px 10px rgba(0,0,0,0.2); }
        .btn-red:active { box-shadow: 0px 0px 0px #b91c1c, 0px 2px 4px rgba(0,0,0,0.2); }

        .btn-green { background: linear-gradient(to bottom, #10b981, #059669); box-shadow: 0px 6px 0px #047857, 0px 8px 10px rgba(0,0,0,0.2); }
        .btn-green:active { box-shadow: 0px 0px 0px #047857, 0px 2px 4px rgba(0,0,0,0.2); }
        
        .btn-purple { background: linear-gradient(to bottom, #8b5cf6, #7c3aed); box-shadow: 0px 6px 0px #5b21b6, 0px 8px 10px rgba(0,0,0,0.2); }
        .btn-purple:active { box-shadow: 0px 0px 0px #5b21b6, 0px 2px 4px rgba(0,0,0,0.2); }

        .btn-orange { background: linear-gradient(to bottom, #f97316, #ea580c); box-shadow: 0px 6px 0px #c2410c, 0px 8px 10px rgba(0,0,0,0.2); }
        .btn-orange:active { box-shadow: 0px 0px 0px #c2410c, 0px 2px 4px rgba(0,0,0,0.2); }

        /* News Layout Styles */
        .news-card {
            display: flex;
            flex-direction: column;
            background: #f8fafc;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }

        .news-image-container {
            width: 100%;
            padding: 12px;
        }

        .news-image {
            width: 100%;
            height: auto;
            border-radius: 12px;
            border: 4px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); /* Stroke and shadow as requested */
            object-fit: cover;
        }

        .news-content {
            padding: 16px;
        }

        @media (min-width: 400px) {
            .news-card {
                flex-direction: row;
                align-items: flex-start;
            }
            .news-image-container {
                width: 40%;
                padding-right: 0;
            }
            .news-content {
                width: 60%;
            }
        }

        /* Form Inputs */
        .input-field {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .input-field:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        /* Screen Transitions */
        .screen {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header Animation */
        .header-bg {
            background-image: url('data:image/svg+xml,%3Csvg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"%3E%3Cpath d="M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z" fill="%23ffffff" fill-opacity="0.2" fill-rule="evenodd"/%3E%3C/svg%3E');
        }
    </style>

<style id="v3d-enhance">
:root{--c1:#ff4d8d;--c2:#ffb020;--c3:#22c55e;--c4:#06b6d4;--c5:#8b5cf6}
body{background:linear-gradient(135deg,#fde68a,#fbcfe8 35%,#bae6fd 70%,#c4b5fd);background-size:300% 300%;animation:bgflow 14s ease infinite;perspective:1200px;overflow-x:hidden}
@keyframes bgflow{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.app-container{background:linear-gradient(180deg,#fff 0%,#fff7fb 60%,#f0f9ff 100%);box-shadow:0 30px 60px rgba(88,28,135,.35),0 0 0 6px rgba(255,255,255,.6);transform-style:preserve-3d}
/* floating 3D shapes */
#shapes{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.shp{position:absolute;opacity:.85;animation:float 9s ease-in-out infinite}
.shp.cube{width:46px;height:46px;transform-style:preserve-3d;animation:spin 10s linear infinite}
.shp.cube i{position:absolute;inset:0;border-radius:6px;opacity:.9;border:2px solid rgba(255,255,255,.7)}
.shp.cube i:nth-child(1){transform:translateZ(23px)}.shp.cube i:nth-child(2){transform:rotateY(180deg) translateZ(23px)}
.shp.cube i:nth-child(3){transform:rotateY(90deg) translateZ(23px)}.shp.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(23px)}
.shp.cube i:nth-child(5){transform:rotateX(90deg) translateZ(23px)}.shp.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(23px)}
.shp.ball{border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,var(--b) 55%,rgba(0,0,0,.35));box-shadow:0 12px 20px rgba(0,0,0,.2)}
@keyframes spin{to{transform:rotateX(360deg) rotateY(360deg)}}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -28px}}
.app-container{z-index:1}
/* header */
.header-bg{background-color:transparent!important;background-image:linear-gradient(120deg,#c026d3,#7c3aed,#2563eb,#db2777,#c026d3)!important;background-size:300% 300%!important;animation:bgflow 8s ease infinite;position:relative;overflow:hidden;box-shadow:0 12px 0 #6b21a8,0 20px 25px rgba(76,29,149,.45)!important}
.header-bg::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%{left:-60%}60%,100%{left:130%}}
.title-font.text-3d,h1.title-font{display:inline-block;animation:titlefloat 3.6s ease-in-out infinite;transform-origin:center;text-shadow:1px 2px 0 #4a004a,2px 4px 0 #3b0764,3px 6px 0 #2e1065,4px 8px 0 #1e1b4b,6px 12px 14px rgba(0,0,0,.55)}
@keyframes titlefloat{0%,100%{transform:rotateX(8deg) rotateY(-10deg) translateY(0)}50%{transform:rotateX(-6deg) rotateY(10deg) translateY(-6px)}}
/* 3D rainbow buttons */
.btn-3d-grid{perspective:900px}
.btn-3d{--d:#1d4ed8;--m:#3b82f6;background:linear-gradient(160deg,color-mix(in srgb,var(--m) 70%,#fff),var(--m) 55%,var(--d))!important;box-shadow:0 8px 0 var(--d),0 14px 18px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.55)!important;border-radius:16px;transform-style:preserve-3d;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both,bob 4s ease-in-out infinite;overflow:hidden;will-change:transform}
.btn-3d::before{content:"";position:absolute;top:-40%;left:-30%;width:60%;height:180%;background:rgba(255,255,255,.22);transform:rotate(25deg);transition:left .6s}
.btn-3d:hover::before{left:110%}
.btn-3d i{filter:drop-shadow(0 3px 2px rgba(0,0,0,.35));color:#fff!important;animation:icon 2.8s ease-in-out infinite}
.btn-3d:nth-child(3n+1) i{animation-delay:-.4s}.btn-3d:nth-child(3n+2) i{animation-delay:-1.2s}
@keyframes icon{0%,100%{transform:translateZ(18px) scale(1)}50%{transform:translateZ(18px) scale(1.18) rotate(-6deg)}}
@keyframes pop{from{opacity:0;transform:translateY(30px) rotateX(-50deg) scale(.6)}to{opacity:1}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -4px}}
.btn-3d:nth-child(2n){animation-delay:var(--i,0s),-1s}.btn-3d:nth-child(3n){animation-delay:var(--i,0s),-2s}
.btn-3d:active{transform:translateY(8px)!important;box-shadow:0 0 0 var(--d),0 2px 4px rgba(0,0,0,.3)!important}
.btn-3d:nth-child(1){--m:#ef4444;--d:#991b1b}.btn-3d:nth-child(2){--m:#a855f7;--d:#6b21a8}.btn-3d:nth-child(3){--m:#f97316;--d:#9a3412}
.btn-3d:nth-child(4){--m:#10b981;--d:#065f46}.btn-3d:nth-child(5){--m:#eab308;--d:#a16207}.btn-3d:nth-child(6){--m:#ec4899;--d:#9d174d}
.btn-3d:nth-child(7){--m:#06b6d4;--d:#155e75}.btn-3d:nth-child(8){--m:#fb923c;--d:#c2410c}.btn-3d:nth-child(9){--m:#6366f1;--d:#3730a3}
.btn-3d:nth-child(10){--m:#f43f5e;--d:#9f1239}.btn-3d:nth-child(11){--m:#8b5cf6;--d:#5b21b6}.btn-3d:nth-child(12){--m:#22c55e;--d:#166534}
.btn-3d:nth-child(n+13){--m:#0ea5e9;--d:#075985}
/* inner pages */
#screen-content h2,#screen-submenu h2{background:linear-gradient(90deg,#db2777,#7c3aed,#2563eb,#db2777);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:bgflow 6s linear infinite;border-image:linear-gradient(90deg,#f472b6,#a78bfa,#38bdf8) 1}
.news-card{background:linear-gradient(135deg,#fff,#fdf2f8);border:2px solid #fbcfe8;border-radius:20px;box-shadow:0 8px 0 #f9a8d4,0 14px 20px rgba(0,0,0,.12);transition:transform .3s,box-shadow .3s;animation:pop .5s both}
.news-card:nth-child(3n+2){background:linear-gradient(135deg,#fff,#eff6ff);border-color:#bfdbfe;box-shadow:0 8px 0 #93c5fd,0 14px 20px rgba(0,0,0,.12)}
.news-card:nth-child(3n){background:linear-gradient(135deg,#fff,#f0fdf4);border-color:#bbf7d0;box-shadow:0 8px 0 #86efac,0 14px 20px rgba(0,0,0,.12)}
.news-card:hover{transform:translateY(-4px) rotateX(3deg)}
.screen{animation:screenin .55s cubic-bezier(.2,.9,.3,1.2)}
@keyframes screenin{from{opacity:0;transform:perspective(800px) rotateY(-18deg) translateX(30px)}to{opacity:1;transform:none}}
.input-field{border-width:3px;border-color:#e9d5ff;box-shadow:inset 0 3px 6px rgba(0,0,0,.08)}
.input-field:focus{border-color:#d946ef;transform:translateY(-2px)}
#login-form,#signup-form{background:linear-gradient(145deg,#fff,#faf5ff)!important;border:2px solid #e9d5ff!important;border-radius:24px!important;box-shadow:0 10px 0 #d8b4fe,0 20px 30px rgba(126,34,206,.25)!important;animation:titlefloat 6s ease-in-out infinite}
button[type=submit]{box-shadow:0 6px 0 rgba(0,0,0,.28)!important;transition:transform .1s,box-shadow .1s}
button[type=submit]:active{transform:translateY(6px) scale(1)!important;box-shadow:0 0 0 rgba(0,0,0,.28)!important}
#screen-dashboard h3{background:linear-gradient(90deg,#ec4899,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.confetti{position:fixed;top:-10px;width:10px;height:14px;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

<style id="v3d-icons">
.btn-3d{height:112px!important;justify-content:flex-start!important;padding-top:10px!important}
.ico3d{position:relative;width:44px;height:44px;margin-bottom:6px;display:flex;align-items:center;justify-content:center;perspective:220px;flex:none}
.ico3d u{position:absolute;inset:2px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff,rgba(255,255,255,.6) 45%,rgba(0,0,0,.25));box-shadow:0 4px 0 rgba(0,0,0,.28),inset 0 -4px 6px rgba(0,0,0,.18);text-decoration:none}

<style id="vm-title">

@keyframes vmwave{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
.vm-ribbon{position:relative;margin-top:12px;padding:2px 26px 6px;border-radius:999px;background:linear-gradient(180deg,#fff,#fdf4ff);box-shadow:0 5px 0 #a21caf,0 10px 14px rgba(30,0,60,.4);transform:rotate(-3deg);overflow:hidden}
.vm-ribbon::after{content:"";position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.9),transparent);animation:shine 4.5s ease-in-out infinite 1s}
.vm-sub{font-family:'Pacifico','Brush Script MT',cursive;font-size:1.5rem;line-height:1.5;background:linear-gradient(90deg,#db2777,#7c3aed,#2563eb);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(255,255,255,.8))}
</style>

<style id="vm-logo">
.vm-logo{position:relative;width:104px;height:104px;margin:0 auto 16px;padding:7px;background:#fff;border-radius:30px;box-shadow:0 6px 0 #d8b4fe,0 14px 22px rgba(30,0,60,.45),inset 0 -3px 0 #f3e8ff;overflow:hidden;animation:vmlogo 4.5s ease-in-out infinite;transform-style:preserve-3d}
.vm-logo img{display:block;width:100%;height:100%;object-fit:contain;border-radius:22px}
.vm-logo::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);animation:shine 5s ease-in-out infinite 2s}
@keyframes vmlogo{0%,100%{transform:translateY(0) rotateY(-8deg)}50%{transform:translateY(-5px) rotateY(8deg)}}
</style>

<style id="vm-content">
.vm-card{background:#fff;border:2px solid #e9d5ff;border-radius:20px;padding:16px;margin-bottom:18px;box-shadow:0 7px 0 #d8b4fe,0 12px 18px rgba(0,0,0,.1);overflow:hidden;animation:pop .5s both}
.vm-card:nth-child(3n+2){border-color:#bae6fd;box-shadow:0 7px 0 #7dd3fc,0 12px 18px rgba(0,0,0,.1)}
.vm-card:nth-child(3n){border-color:#bbf7d0;box-shadow:0 7px 0 #86efac,0 12px 18px rgba(0,0,0,.1)}
.news-card.vm-card{display:block!important;padding:14px}
.vm-h{font-weight:800;font-size:1.1rem;color:#4c1d95;margin-bottom:8px}
.vm-p{color:#475569;font-size:.9rem;line-height:1.6;margin-bottom:10px}
.vm-strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 0 12px;padding-bottom:4px}
.vm-strip img{flex:none;height:190px;max-width:85%;object-fit:cover;border-radius:14px;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.25);scroll-snap-align:start;cursor:zoom-in}
.vm-strip.one img{width:100%;max-width:100%;height:auto;max-height:260px}
.vm-row{display:flex;gap:10px;margin-top:12px}
.vm-btn{flex:1;display:block;text-align:center;font-weight:800;padding:10px 12px;border-radius:14px;color:#fff;margin-top:10px;cursor:pointer;border:0;font-size:.95rem}
.vm-row .vm-btn{margin-top:0}
.vm-btn.blue{background:linear-gradient(#60a5fa,#2563eb);box-shadow:0 5px 0 #1e40af}.vm-btn.green{background:linear-gradient(#4ade80,#16a34a);box-shadow:0 5px 0 #166534}
.vm-btn:active{transform:translateY(4px);box-shadow:none}
.vm-news-text{max-height:4.8em;overflow:hidden;color:#475569;font-size:.9rem;line-height:1.6;position:relative;transition:max-height .4s}
.vm-news-text.open{max-height:2000px}
.vm-more{color:#7c3aed;font-weight:800;font-size:.85rem;margin-top:6px;background:none;border:0;cursor:pointer}
.vm-audio{width:100%;margin-top:6px}.vm-aframe{width:100%;height:110px;border:0;border-radius:12px}
.vm-modal{position:fixed;inset:0;z-index:400;background:rgba(20,5,45,.88);display:flex;align-items:center;justify-content:center;padding:14px;animation:pop .25s both}
.vm-frame{width:min(96vw,760px);height:84vh;border:0;border-radius:16px;background:#fff}
.vm-zoom{max-width:96vw;max-height:88vh;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.vm-x{position:absolute;top:10px;right:12px;width:42px;height:42px;border-radius:50%;border:0;background:#fff;font-size:1.2rem;font-weight:800;color:#be123c;box-shadow:0 4px 0 #fda4af;z-index:2}
.qz{background:linear-gradient(160deg,#fff,#faf5ff);border:2px solid #e9d5ff;border-radius:24px;padding:16px;box-shadow:0 9px 0 #c4b5fd,0 16px 24px rgba(88,28,135,.2)}
.qz-top{display:flex;justify-content:space-between;font-weight:800;color:#6d28d9;margin-bottom:6px}
.qz-bar{height:10px;border-radius:9px;background:#ede9fe;overflow:hidden;margin-bottom:12px}.qz-bar i{display:block;height:100%;background:linear-gradient(90deg,#f472b6,#8b5cf6,#38bdf8);transition:width .5s}
.qz-q{font-size:1.25rem;font-weight:800;color:#1e1b4b;line-height:1.5;margin:6px 0 14px;animation:pop .4s both}
.qz-opts{display:grid;gap:12px}
.qz-o{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:12px 14px;border:0;border-radius:16px;color:#fff;font-weight:800;font-size:1.05rem;background:linear-gradient(160deg,color-mix(in srgb,var(--m) 70%,#fff),var(--m));box-shadow:0 6px 0 var(--d),0 10px 14px rgba(0,0,0,.2);cursor:pointer;animation:pop .45s both}
.qz-o b{flex:none;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--d);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.qz-o:nth-child(2){animation-delay:.08s}.qz-o:nth-child(3){animation-delay:.16s}.qz-o:nth-child(4){animation-delay:.24s}
.qz-o:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--d)}
.qz-o:disabled{cursor:default}.qz-o:disabled:not(.ok):not(.bad){opacity:.45}
.qz-o.ok{--m:#22c55e;--d:#15803d;animation:qzok .6s}.qz-o.bad{--m:#ef4444;--d:#991b1b;animation:qzbad .5s}
@keyframes qzok{50%{transform:scale(1.05)}}@keyframes qzbad{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.qz-fb{text-align:center;margin-top:14px}.qz-fb .good{font-size:1.4rem;font-weight:800;color:#15803d}.qz-fb .oops{font-weight:800;color:#b91c1c}
.qz-next{display:block;width:100%;margin-top:12px;padding:12px;border:0;border-radius:16px;color:#fff;font-weight:800;font-size:1.05rem;background:linear-gradient(#a78bfa,#7c3aed);box-shadow:0 6px 0 #5b21b6;cursor:pointer}
.qz-end{text-align:center}.qz-trophy{font-size:4.5rem;animation:ik-spin 3s linear infinite;display:inline-block}.qz-stars{font-size:2rem;margin:4px 0}
.qz-end h3{font-weight:800;font-size:1.3rem;color:#4c1d95}.qz-end p{color:#475569;margin-top:6px}
</style>

<style id="vm-inapp">
.vm-box{display:flex;flex-direction:column;align-items:center;gap:10px}
.vm-ext{color:#fff;font-weight:700;font-size:.85rem;text-decoration:underline;text-align:center}
.vm-prev{position:relative;margin:0 0 12px}
.vm-prev img{display:block;width:100%;max-height:300px;object-fit:cover;object-position:top;border-radius:14px;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.25);cursor:zoom-in;background:#f1f5f9;min-height:60px}
.vm-tap{position:absolute;right:8px;bottom:8px;background:rgba(124,58,237,.9);color:#fff;font-size:.75rem;font-weight:800;padding:3px 10px;border-radius:99px}
.vm-folder{width:100%;height:300px;border:0;border-radius:14px;background:#f8fafc;margin-bottom:12px}
.vm-yt{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;margin-bottom:10px;background:#000}
</style>
</head>

    <script type="module">
        // Content comes from the Google Sheet (see sheetApiUrl below); no login or Firebase needed.

        // Helper function for showing alerts/messages
        window.showMessage = function(msg, isError = false) {
            const msgBox = document.getElementById('message-box');
            msgBox.textContent = msg;
            msgBox.className = `absolute top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full text-sm font-medium z-50 transition-opacity duration-300 pointer-events-none w-11/12 text-center shadow-xl ${isError ? 'bg-red-600 text-white' : 'bg-gray-800 text-white'}`;
            msgBox.style.opacity = '1';
            setTimeout(() => {
                msgBox.style.opacity = '0';
            }, 3000);
        };

        // Navigation
        window.switchScreen = function(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            window.scrollTo(0,0);
        };

        // Open the menu directly
        function initApp() {
            switchScreen('screen-dashboard');
        }

        /* 
        ---------------------------------------------------------
        Google Sheets Script Integration (Explanation for Admin)
        ---------------------------------------------------------
        നിങ്ങൾ ഗൂഗിൾ ഷീറ്റിൽ ഡാറ്റ നൽകിയ ശേഷം App Script വഴി Deploy ചെയ്ത് 
        കിട്ടുന്ന URL താഴെ കാണുന്ന `sheetApiUrl` എന്ന വേരിയബിളിൽ നൽകുക.
        
        App Script മാതൃക (Google Sheet-ൽ Extensions > Apps Script):
        
        function doGet(e) {
          var sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName("Data");
          var data = sheet.getDataRange().getValues();
          var result = [];
          
          for (var i = 1; i < data.length; i++) {
            result.push({
              category: data[i][0], // ഉദാ: 'news', 'newspaper'
              title: data[i][1],
              content: data[i][2],
              imageUrl: data[i][3],
              link: data[i][4]
            });
          }
          return ContentService.createTextOutput(JSON.stringify(result)).setMimeType(ContentService.MimeType.JSON);
        }
        ---------------------------------------------------------
        */

        const sheetApiUrl = "https://script.google.com/macros/s/AKfycbyMg03jqM2SAHOwysWlKTw5IkgWlEpNOUA6UCKE0-0j5kvW5AoLAlFOxpC1eTDhMmzLFA/exec"; // നിങ്ങളുടെ Google App Script Web App URL ഇവിടെ നൽകാം

        // ഡെമോയ്ക്കായി നൽകിയിരിക്കുന്ന സാങ്കൽപ്പിക ഡാറ്റ ഒഴിവാക്കി
        const mockData = [];

        window.openSubMenu = function(menuId, title) {
            document.getElementById('submenu-title').textContent = title;
            const grid = document.getElementById('submenu-grid');
            grid.innerHTML = ''; // Clear previous buttons
            
            let buttons = [];
            let backTarget = 'screen-dashboard';

            // Check if it's a deeply nested menu inside Question Bank to handle "Back" properly
            if (menuId.startsWith('bank_1') || menuId.startsWith('bank_2') || menuId.startsWith('bank_3') || menuId.startsWith('bank_4') || menuId === 'bank_pre') {
                backTarget = 'back_to_bank';
            }

            // Define Submenus
            if (menuId === 'bank') {
                buttons = [
                    { id: 'bank_pre', label: 'പ്രീ പ്രൈമറി', icon: 'fa-child', color: 'btn-red' },
                    { id: 'bank_1', label: 'ക്ലാസ്സ് 1', icon: 'fa-book', color: 'btn-green' },
                    { id: 'bank_2', label: 'ക്ലാസ്സ് 2', icon: 'fa-book', color: 'btn-purple' },
                    { id: 'bank_3', label: 'ക്ലാസ്സ് 3', icon: 'fa-book', color: 'btn-orange' },
                    { id: 'bank_4', label: 'ക്ലാസ്സ് 4', icon: 'fa-book', color: '' }
                ];
            } else if (menuId === 'bank_pre') {
                buttons = [
                    { cat: 'bank_lkg', label: 'LKG', icon: 'fa-shapes', color: 'btn-purple' },
                    { cat: 'bank_ukg', label: 'UKG', icon: 'fa-shapes', color: 'btn-orange' }
                ];
            } else if (menuId === 'bank_1' || menuId === 'bank_2') {
                let cls = menuId === 'bank_1' ? '1' : '2';
                buttons = [
                    { cat: `bank_${cls}_arabic`, label: 'അറബിക്', icon: 'fa-language', color: 'btn-green' },
                    { cat: `bank_${cls}_english`, label: 'ഇംഗ്ലീഷ്', icon: 'fa-font', color: 'btn-purple' },
                    { cat: `bank_${cls}_udg1`, label: 'ഉദ്ഗ്രഥിതം-1', icon: 'fa-leaf', color: 'btn-orange' },
                    { cat: `bank_${cls}_udg2`, label: 'ഉദ്ഗ്രഥിതം-2', icon: 'fa-leaf', color: 'btn-red' },
                    { cat: `bank_${cls}_udg3`, label: 'ഉദ്ഗ്രഥിതം-3', icon: 'fa-leaf', color: '' }
                ];
            } else if (menuId === 'bank_3' || menuId === 'bank_4') {
                let cls = menuId === 'bank_3' ? '3' : '4';
                buttons = [
                    { cat: `bank_${cls}_arabic`, label: 'അറബിക്', icon: 'fa-language', color: 'btn-green' },
                    { cat: `bank_${cls}_english`, label: 'ഇംഗ്ലീഷ്', icon: 'fa-font', color: 'btn-purple' },
                    { cat: `bank_${cls}_malayalam`, label: 'മലയാളം', icon: 'fa-pen-fancy', color: 'btn-orange' },
                    { cat: `bank_${cls}_evs`, label: 'ഇവിഎസ്', icon: 'fa-globe-asia', color: 'btn-red' },
                    { cat: `bank_${cls}_maths`, label: 'മാത്സ്', icon: 'fa-calculator', color: '' }
                ];
            } else if (menuId === 'lss') {
                buttons = [
                    { cat: 'lss_previous', label: 'പ്രീവിയസ് ക്വസ്റ്റ്യൻസ്', icon: 'fa-file-alt', color: 'btn-purple' },
                    { cat: 'lss_games', label: 'ഗെയിംസ്', icon: 'fa-gamepad', color: 'btn-orange' }
                ];
            } else if (menuId === 'festivals') {
                buttons = [
                    { cat: 'kalolsavam', label: 'സ്കൂൾ കലോത്സവം', icon: 'fa-theater-masks', color: 'btn-red' },
                    { cat: 'sports', label: 'സ്കൂൾ കായികമേള', icon: 'fa-running', color: 'btn-orange' },
                    { cat: 'sasthrolsavam', label: 'സ്കൂൾ ശാസ്ത്രോത്സവം', icon: 'fa-flask', color: 'btn-green' }
                ];
            }

            // Render Submenu Buttons
            buttons.forEach(btn => {
                const b = document.createElement('button');
                b.className = `btn-3d ${btn.color || ''}`;
                
                // Keep the text size consistent and readable for multi-line
                b.innerHTML = `
                    ${window.ico3d(btn.icon)}
                    <span style="font-size: 0.9rem;">${btn.label}</span>
                `;
                
                // If it has a 'cat', it fetches data. If it has 'id', it opens another submenu.
                if (btn.cat) {
                    b.onclick = () => openCategory(btn.cat, btn.label, 'screen-submenu');
                } else {
                    b.onclick = () => openSubMenu(btn.id, btn.label);
                }
                grid.appendChild(b);
            });

            // Handle Back Button Logic
            const backBtn = document.getElementById('submenu-back-btn');
            if (backTarget === 'back_to_bank') {
                backBtn.onclick = () => openSubMenu('bank', 'ക്വസ്റ്റ്യൻ ബാങ്ക്');
            } else {
                backBtn.onclick = () => switchScreen('screen-dashboard');
            }

            switchScreen('screen-submenu');
        };

        window.openCategory = async function(categoryId, title, backScreenId = 'screen-dashboard') {
            document.getElementById('content-title').textContent = title;
            document.getElementById('content-back-btn').setAttribute('onclick', `switchScreen('${backScreenId}')`);
            
            switchScreen('screen-content');
            
            const contentArea = document.getElementById('dynamic-content-area');
            contentArea.innerHTML = `<div class="text-center py-10 text-gray-500">
                <i class="fas fa-circle-notch fa-spin text-3xl mb-3 text-blue-400"></i>
                <p>വിവരങ്ങൾ ലഭ്യമാക്കുന്നു...</p>
            </div>`;

            let items = [];

            try {
                // If a Google sheet URL is provided, fetch from it
                if (sheetApiUrl !== "") {
                    const allData = await window.vmFetch();
                    items = allData.filter(item => item.category === categoryId);
                } else {
                    // Using Mock Data for preview
                    await new Promise(r => setTimeout(r, 600)); // Simulate network delay
                    items = mockData.filter(item => item.category === categoryId);
                }

                renderContent(items, categoryId, contentArea);

            } catch (error) {
                console.error("Error fetching data:", error);
                contentArea.innerHTML = `
                    <div class="text-center p-6 bg-red-50 rounded-xl border border-red-100">
                        <i class="fas fa-exclamation-triangle text-red-500 text-3xl mb-3"></i>
                        <p class="text-red-700">വിവരങ്ങൾ ലഭ്യമാക്കുന്നതിൽ തടസ്സം നേരിട്ടു.</p>
                    </div>`;
            }
        };

        
        /* ---- Google Sheet / Drive helpers ---- */
        const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const nl=t=>esc(t).replace(/\n/g,'<br>');
        const isDrive=u=>/(drive|docs)\.google\.com/.test(u||'')&&!!driveId(u);
        const driveId=u=>{const m=String(u||'').match(/\/d\/([\w-]+)|[?&]id=([\w-]+)/);return m?(m[1]||m[2]):null};
        const imgSrc=u=>isDrive(u)?`https://drive.google.com/thumbnail?id=${driveId(u)}&sz=w1200`:u;
        const imgs=u=>String(u||'').split(/[\s,]+/).filter(x=>/^https?:/.test(x)).map(imgSrc);
        const prevUrl=u=>isDrive(u)?`https://drive.google.com/file/d/${driveId(u)}/preview`:u;
        const dlUrl=u=>isDrive(u)?`https://drive.google.com/uc?export=download&id=${driveId(u)}`:u;
        let _cache=null,_t=0;
        window.vmFetch=async function(){
            if(_cache&&Date.now()-_t<60000)return _cache;
            const r=await fetch(sheetApiUrl);_cache=await r.json();_t=Date.now();return _cache;
        };
        function modal(inner){
            const m=document.createElement('div');m.className='vm-modal';
            m.innerHTML='<button class="vm-x" aria-label="close">✕</button>'+inner;
            m.onclick=e=>{if(e.target===m||e.target.classList.contains('vm-x'))m.remove()};
            document.body.appendChild(m);
        }
        function sfx(ok){
            try{const c=new (window.AudioContext||window.webkitAudioContext)();
                (ok?[660,880]:[220,160]).forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
                    o.type=ok?'triangle':'sawtooth';o.frequency.value=f;g.gain.value=.12;
                    o.connect(g);g.connect(c.destination);o.start(c.currentTime+i*.14);o.stop(c.currentTime+i*.14+.16);});}catch(e){}
        }
        function pop(el){
            const r=el.getBoundingClientRect(),cs=['#f43f5e','#f59e0b','#22c55e','#06b6d4','#8b5cf6','#ec4899'];
            for(let i=0;i<16;i++){const d=document.createElement('div');d.className='confetti';
                d.style.left=(r.left+r.width/2+(Math.random()-.5)*180)+'px';d.style.top=(r.top-10)+'px';
                d.style.background=cs[i%6];d.style.animationDuration=(1+Math.random()*1.2)+'s';
                document.body.appendChild(d);setTimeout(()=>d.remove(),2400);}
        }
        const strip=list=>list.length?`<div class="vm-strip ${list.length===1?'one':''}">${list.map(u=>`<img src="${esc(u)}" data-act="zoom" data-src="${esc(u)}" loading="lazy" alt="" onerror="this.style.display='none'">`).join('')}</div>`:'';

        /* ---- ചോദ്യമഴ: quiz game from sheet ----
           Sheet row: category=questions | title=ചോദ്യം | content=ഓപ്ഷനുകൾ "|" കൊണ്ട് വേർതിരിച്ച്, ശരിയുത്തരത്തിന് മുന്നിൽ * | imageUrl=ചിത്രം (ഓപ്ഷണൽ) */
        function renderQuiz(items,container){
            const qs=items.map(it=>{
                const raw=String(it.content||'').split('|').map(x=>x.trim()).filter(Boolean);
                if(raw.length<2)return null;
                let ans=raw.findIndex(o=>o.startsWith('*'));if(ans<0)ans=0;
                return {q:it.title,img:imgs(it.imageUrl),opts:raw.map((o,i)=>({t:o.replace(/^\*\s*/,''),ok:i===ans}))};
            }).filter(Boolean);
            if(!qs.length)return false;
            const col=['#ef4444|#991b1b','#3b82f6|#1e40af','#f59e0b|#b45309','#10b981|#047857'],lt=['അ','ആ','ഇ','ഈ','ഉ','ഊ'];
            let order,i,score,q,locked;
            const shuf=a=>a.slice().sort(()=>Math.random()-.5);
            function start(){order=shuf(qs);i=0;score=0;show();}
            function show(){
                q=order[i];q.sh=shuf(q.opts);locked=false;
                container.innerHTML=`<div class="qz"><div class="qz-top"><span>ചോദ്യം ${i+1}/${order.length}</span><span>⭐ ${score}</span></div>
                <div class="qz-bar"><i style="width:${i/order.length*100}%"></i></div>${strip(q.img)}
                <div class="qz-q">${nl(q.q)}</div>
                <div class="qz-opts">${q.sh.map((o,k)=>{const c=col[k%4].split('|');return `<button class="qz-o" data-k="${k}" style="--m:${c[0]};--d:${c[1]}"><b>${lt[k%6]}</b><span>${esc(o.t)}</span></button>`}).join('')}</div>
                <div class="qz-fb"></div></div>`;
            }
            function end(){
                const r=score/order.length,st=r>=.8?3:r>=.5?2:1;
                container.innerHTML=`<div class="qz qz-end"><div class="qz-trophy">🏆</div><div class="qz-stars">${'⭐'.repeat(st)}</div>
                <h3>നിങ്ങളുടെ സ്കോർ ${score} / ${order.length}</h3><p>${r>=.8?'അഭിനന്ദനങ്ങൾ! മിടുക്കൻ/മിടുക്കി! 🎉':r>=.5?'നല്ല ശ്രമം! ഒന്നുകൂടി ശ്രമിക്കാം 👍':'സാരമില്ല, വീണ്ടും കളിച്ചു നോക്കൂ 💪'}</p>
                <button class="qz-next" data-act="again">വീണ്ടും കളിക്കാം 🔄</button></div>`;
                if(r>=.5)pop(container.querySelector('.qz-trophy'));
            }
            container.onclick=e=>{
                const z=e.target.closest('[data-act="zoom"]');if(z){modal(`<img class="vm-zoom" src="${z.dataset.src}" alt="">`);return;}
                if(e.target.closest('[data-act="again"]')){start();return;}
                if(e.target.closest('.qz-next')){i++;i<order.length?show():end();return;}
                const b=e.target.closest('.qz-o');if(!b||locked)return;locked=true;
                const ok=q.sh[+b.dataset.k].ok;
                container.querySelectorAll('.qz-o').forEach((x,k)=>{x.disabled=true;if(q.sh[k].ok)x.classList.add('ok')});
                const fb=container.querySelector('.qz-fb');
                if(ok){score++;fb.innerHTML='<div class="good">ശരി! 🎉</div>';pop(b);}
                else{b.classList.add('bad');fb.innerHTML=`<div class="oops">ശരിയുത്തരം: ${esc(q.sh.find(o=>o.ok).t)}</div>`;}
                sfx(ok);
                fb.insertAdjacentHTML('beforeend',`<button class="qz-next">${i+1<order.length?'അടുത്തത് ▶':'ഫലം കാണാം 🏆'}</button>`);
            };
            start();return true;
        }


        /* ---- Open any sheet link INSIDE the app (Drive file/folder, Docs, YouTube, image, web) ---- */
        function parseLink(u){
            u=String(u||'').trim();let m;
            if(!u)return null;
            if(m=u.match(/drive\.google\.com\/(?:drive\/(?:u\/\d+\/)?folders\/|embeddedfolderview\?id=)([\w-]+)/))
                return {k:'folder',id:m[1],embed:`https://drive.google.com/embeddedfolderview?id=${m[1]}#grid`};
            if(m=u.match(/docs\.google\.com\/(document|spreadsheets|presentation)\/d\/([\w-]+)/)){
                const t=m[1],id=m[2];
                return {k:'doc',id,embed:t==='presentation'?`https://docs.google.com/presentation/d/${id}/embed?start=false&loop=false`:`https://docs.google.com/${t}/d/${id}/preview`};
            }
            if(m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=|thumbnail\?id=)([\w-]+)/)||u.match(/drive\.google\.com\/.*[?&]id=([\w-]+)/))
                return {k:'file',id:m[1],embed:`https://drive.google.com/file/d/${m[1]}/preview`};
            if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/))
                return {k:'yt',id:m[1],embed:`https://www.youtube.com/embed/${m[1]}`};
            if(/\.(jpe?g|png|gif|webp|svg)(\?|#|$)/i.test(u))return {k:'img',src:u};
            return {k:'web',embed:u};
        }
        function openLink(url,title){
            const p=parseLink(url);if(!p)return;
            if(p.k==='img'){modal(`<img class="vm-zoom" src="${esc(p.src)}" alt="">`);return;}
            modal(`<div class="vm-box"><iframe class="vm-frame" src="${esc(p.embed)}" allow="autoplay; fullscreen" allowfullscreen title="${esc(title)}"></iframe>${p.k==='web'?`<a class="vm-ext" href="${esc(url)}" target="_blank" rel="noopener noreferrer">സൈറ്റ് ഇവിടെ തുറക്കുന്നില്ലെങ്കിൽ ഇവിടെ അമർത്തുക ↗</a>`:''}</div>`);
        }
        /* preview shown inside the card for the sheet link */
        function prevBlock(link,title){
            const p=parseLink(link);if(!p)return '';
            const a=`data-act="view" data-url="${esc(link)}" data-title="${esc(title)}"`;
            if(p.k==='folder')return `<iframe class="vm-folder" src="${esc(p.embed)}" loading="lazy" title="${esc(title)}"></iframe>`;
            if(p.k==='yt')return `<iframe class="vm-yt" src="${esc(p.embed)}" allowfullscreen loading="lazy" title="${esc(title)}"></iframe>`;
            const src=p.k==='img'?p.src:(p.k==='file'||p.k==='doc')?`https://drive.google.com/thumbnail?id=${p.id}&sz=w1000`:'';
            return src?`<div class="vm-prev"><img src="${esc(src)}" ${a} loading="lazy" alt="" onerror="this.parentNode.style.display='none'"><span class="vm-tap">👆 തൊട്ടാൽ വലുതായി കാണാം</span></div>`:'';
        }

        function renderContent(items, categoryId, container) {
            container.onclick=null;
            if (items.length === 0) {
                container.innerHTML = `
                    <div class="text-center p-8 bg-gray-50 rounded-2xl border border-gray-200 mt-4">
                        <i class="fas fa-folder-open text-gray-300 text-5xl mb-4"></i>
                        <p class="text-gray-600 font-medium text-lg">പുതിയ വിവരങ്ങൾ ഉടൻ ഉൾപ്പെടുത്തും!</p>
                        <p class="text-sm text-gray-400 mt-2">No items found for this category.</p>
                    </div>`;
                return;
            }
            if (categoryId === 'questions' && renderQuiz(items, container)) return;

            const isPdf = categoryId === 'newspaper' || categoryId.startsWith('bank') || categoryId === 'lss_previous';
            let html = '';
            items.forEach((item, n) => {
                const link = String(item.link || '').trim();
                const pics = imgs(item.imageUrl);
                const pv = (!pics.length && categoryId !== 'radio') ? prevBlock(link, item.title) : '';
                if (categoryId === 'news') {
                    html += `<div class="news-card vm-card">${strip(pics)}${pv}
                        <div class="news-content"><h3 class="text-xl font-bold text-blue-900 mb-2">${esc(item.title)}</h3>
                        <p class="text-gray-700 leading-relaxed text-sm md:text-base">${nl(item.content)}</p>
                        ${link ? `<button data-act="view" data-url="${esc(link)}" data-title="${esc(item.title)}" class="vm-btn blue">കൂടുതൽ വായിക്കുക ➜</button>` : ''}</div></div>`;
                } else if (categoryId === 'radio') {
                    const pl = parseLink(link);
                    const ok = (pl && pl.k === 'yt') ? `<iframe class="vm-yt" src="${esc(pl.embed)}" allowfullscreen loading="lazy"></iframe>` : link ? `<audio controls preload="none" class="vm-audio" data-url="${esc(link)}" src="${esc(dlUrl(link))}"></audio>` : '';
                    html += `<div class="vm-card"><h3 class="vm-h">📻 ${esc(item.title)}</h3>${strip(pics)}
                        ${item.content ? `<p class="vm-p">${nl(item.content)}</p>` : ''}${ok}</div>`;
                } else if (categoryId === 'newspaper') {
                    html += `<div class="vm-card">${strip(pics)}${pv}<h3 class="vm-h">🦋 ${esc(item.title)}</h3>
                        ${item.content ? `<div class="vm-news-text" id="nt${n}">${nl(item.content)}</div><button data-act="more" data-t="nt${n}" class="vm-more">പത്രത്തിലെ വാർത്തകൾ വായിക്കുക ▾</button>` : ''}
                        ${link ? `<div class="vm-row"><button data-act="view" data-url="${esc(link)}" data-title="${esc(item.title)}" class="vm-btn blue">📖 വായിക്കുക</button>
                        <a href="${esc(dlUrl(link))}" download target="_blank" rel="noopener noreferrer" class="vm-btn green">⬇️ ഡൗൺലോഡ്</a></div>` : ''}</div>`;
                } else {
                    let act = '';
                    if (link) act = isPdf
                        ? `<div class="vm-row"><button data-act="view" data-url="${esc(link)}" data-title="${esc(item.title)}" class="vm-btn blue">📖 വായിക്കുക</button><a href="${esc(dlUrl(link))}" download target="_blank" rel="noopener noreferrer" class="vm-btn green">⬇️ ഡൗൺലോഡ്</a></div>`
                        : `<button data-act="view" data-url="${esc(link)}" data-title="${esc(item.title)}" class="vm-btn blue">കാണുക 👁</button>`;
                    html += `<div class="vm-card"><h3 class="vm-h">🔖 ${esc(item.title)}</h3>${strip(pics)}${pv}${item.content ? `<p class="vm-p">${nl(item.content)}</p>` : ''}${act}</div>`;
                }
            });
            container.innerHTML = html;
            container.onclick = e => {
                const z = e.target.closest('[data-act="zoom"]');
                if (z) { modal(`<img class="vm-zoom" src="${z.dataset.src}" alt="">`); return; }
                const m = e.target.closest('[data-act="more"]');
                if (m) { const t = document.getElementById(m.dataset.t); t.classList.toggle('open'); m.textContent = t.classList.contains('open') ? 'ചുരുക്കുക ▴' : 'പത്രത്തിലെ വാർത്തകൾ വായിക്കുക ▾'; return; }
                const v = e.target.closest('[data-act="view"]');
                if (v) openLink(v.dataset.url, v.dataset.title);
            };
            if (!container._aud) {
                container._aud = true;
                container.addEventListener('error', ev => {
                    const a = ev.target;
                    if (a.tagName === 'AUDIO' && !a.dataset.fb) {
                        a.dataset.fb = 1;
                        a.outerHTML = `<iframe class="vm-aframe" src="${esc(prevUrl(a.dataset.url))}" allow="autoplay"></iframe>`;
                    }
                }, true);
            }
        }

        // Initialize App on load and Generate PWA Manifest dynamically
        window.addEventListener('DOMContentLoaded', () => {
            initApp();
            
            const manifest = {
                "name": "വിദ്യമിത്രം സ്കൂൾ ആപ്പ്",
                "short_name": "വിദ്യമിത്രം",
                "start_url": window.location.href,
                "display": "standalone",
                "background_color": "#e0f2fe",
                "theme_color": "#2563eb",
                "icons": [{
                    "src": "https://placehold.co/512x512/2563eb/ffffff?text=V",
                    "sizes": "512x512",
                    "type": "image/png"
                }]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            document.getElementById('pwa-manifest').setAttribute('href', URL.createObjectURL(manifestBlob));
        });

    </script>

<script>
(function(){
  // floating 3D cubes and balls
  var box=document.createElement('div');box.id='shapes';
  var cols=['#f43f5e','#f59e0b','#22c55e','#06b6d4','#8b5cf6','#ec4899'];
  for(var i=0;i<14;i++){
    var s=document.createElement('div'),c=cols[i%6];
    if(i%2){s.className='shp cube';s.innerHTML='<i></i><i></i><i></i><i></i><i></i><i></i>';
      [].forEach.call(s.children,function(f){f.style.background=c});}
    else{s.className='shp ball';s.style.setProperty('--b',c);var z=26+Math.random()*34;s.style.width=s.style.height=z+'px';}
    s.style.left=(Math.random()*96)+'%';s.style.top=(Math.random()*90)+'%';
    s.style.animationDelay=(-Math.random()*9)+'s';
    box.appendChild(s);
  }
  document.body.insertBefore(box,document.body.firstChild);
  // staggered button entrance
  function stagger(){document.querySelectorAll('.btn-3d').forEach(function(b,i){b.style.setProperty('--i',(i*0.06)+'s')})}
  stagger();
  new MutationObserver(stagger).observe(document.body,{childList:true,subtree:true});
  // pointer tilt on the whole app (desktop) and buttons
  var app=document.querySelector('.app-container');
  document.addEventListener('mousemove',function(e){
    if(window.innerWidth<700||!app)return;
    var x=(e.clientX/innerWidth-.5)*6,y=(e.clientY/innerHeight-.5)*-4;
    app.style.transform='rotateY('+x+'deg) rotateX('+y+'deg)';
  });
  // confetti burst on button tap
  function burst(x,y){
    var cs=['#f43f5e','#f59e0b','#22c55e','#06b6d4','#8b5cf6','#ec4899'];
    for(var i=0;i<18;i++){
      var d=document.createElement('div');d.className='confetti';
      d.style.left=(x+(Math.random()-.5)*160)+'px';d.style.top=(y-20)+'px';
      d.style.background=cs[i%6];d.style.animationDuration=(1.2+Math.random()*1.2)+'s';
      document.body.appendChild(d);setTimeout(function(n){n.remove()},2600,d);
    }
  }
  document.addEventListener('click',function(e){
    if(e.target.closest('.btn-3d,button[type=submit]'))burst(e.clientX,e.clientY);
  });
})();
</script>
</body>
